name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signalharbor_test
          POSTGRES_USER: signalharbor
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U signalharbor -d signalharbor_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://signalharbor:test_password@localhost:5432/signalharbor_test
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: sample-password-not-used-in-production
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m signalharbor.manage migrate
      - run: pytest -q
      - run: python -m compileall -q signalharbor
      - run: node --check signalharbor/static/app.js
      - run: cp .env.example .env && docker compose config --quiet
