services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalharbor
      POSTGRES_USER: signalharbor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalharbor -d signalharbor"]
      interval: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://signalharbor:${POSTGRES_PASSWORD}@db:5432/signalharbor
    depends_on:
      db:
        condition: service_healthy
    command: ["python","-m","signalharbor.manage","migrate"]
    restart: "no"
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://signalharbor:${POSTGRES_PASSWORD}@db:5432/signalharbor
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn","signalharbor.api:app","--host","0.0.0.0","--port","8000"]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://signalharbor:${POSTGRES_PASSWORD}@db:5432/signalharbor
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python","-m","signalharbor.worker"]
    restart: unless-stopped
volumes:
  postgres_data:
